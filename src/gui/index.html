<!doctype html>
<html lang="zh-CN" data-kb-theme="light" data-kb-theme-name="terminal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>YorZ</title>
    <!--
      主题引导：必须同步执行且早于样式表，否则首屏会先按默认亮色绘制再跳到暗色。
      最终用户偏好由服务端全局配置接管；这里仅用系统偏好给首屏兜底。
    -->
    <script>
      ;(function () {
        try {
          var name = 'terminal'
          var resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          document.documentElement.setAttribute('data-kb-theme', resolved)
          document.documentElement.setAttribute('data-kb-theme-name', name)
          document.documentElement.style.colorScheme = resolved
        } catch (e) {}
      })()
    </script>
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
